name: Sync Fork on branch push

on:
  push:
    branches:
      - develop
      - main

jobs:
  sync-fork:
    if: github.repository == 'team-gamyeon/gamyeon-nextjs-frontend'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fork sync
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FORK_SYNC_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Decseung',
              repo: 'gamyeon-nextjs-frontend',
              workflow_id: 'sync-upstream.yml',
              ref: '${{ github.ref_name }}',
              inputs: {
                branch: '${{ github.ref_name }}'
              }
            });
